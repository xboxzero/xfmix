<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xfmix – Computer Music Synthesizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #0f0;
            padding: 20px;
            line-height: 1.4;
            overflow-x: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #0f0;
            padding-bottom: 15px;
        }

        .header h1 {
            font-size: 24px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #0f0;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 12px;
            color: #0a0;
            opacity: 0.7;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .instrument {
            border: 2px solid #0f0;
            padding: 20px;
            background: rgba(0, 255, 0, 0.02);
        }

        .instrument h2 {
            font-size: 16px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #0f0;
            padding-bottom: 10px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            display: block;
            color: #0f0;
        }

        .drum-pads {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .pad {
            aspect-ratio: 1;
            border: 2px solid #0f0;
            background: #0a0a0a;
            color: #0f0;
            cursor: pointer;
            font-size: 11px;
            font-family: inherit;
            text-transform: uppercase;
            transition: all 0.1s;
            border-radius: 4px;
        }

        .pad:hover {
            background: rgba(0, 255, 0, 0.1);
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .pad:active {
            background: #0f0;
            color: #0a0a0a;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.8);
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(to right, #0a0a0a 0%, #0f0 50%, #0a0a0a 100%);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #0f0;
            cursor: pointer;
            box-shadow: 0 0 8px #0f0;
        }

        input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #0f0;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 8px #0f0;
        }

        .keyboard {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 2px;
            margin-top: 10px;
        }

        .key {
            aspect-ratio: 1;
            border: 1px solid #0f0;
            background: #0a0a0a;
            color: #0f0;
            cursor: pointer;
            font-size: 10px;
            font-family: inherit;
            transition: all 0.05s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .key:hover {
            background: rgba(0, 255, 0, 0.05);
        }

        .key:active {
            background: #0f0;
            color: #0a0a0a;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .qubit-section {
            grid-column: 1 / -1;
            border: 2px solid #0f0;
            padding: 20px;
            background: rgba(0, 255, 0, 0.02);
            text-align: center;
        }

        .qubit-section h3 {
            font-size: 14px;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .bloch-sphere {
            width: 150px;
            height: 150px;
            margin: 0 auto;
            border: 2px solid #0f0;
            border-radius: 50%;
            background: #000;
            position: relative;
            cursor: crosshair;
        }

        .bloch-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #0f0;
            position: absolute;
            box-shadow: 0 0 10px #0f0;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .footer {
            grid-column: 1 / -1;
            text-align: center;
            padding: 20px;
            border-top: 2px solid #0f0;
            font-size: 12px;
            margin-top: 30px;
        }

        .status {
            display: inline-block;
            padding: 8px 16px;
            border: 1px solid #0f0;
            background: rgba(0, 255, 0, 0.05);
            border-radius: 4px;
            font-size: 11px;
        }

        .status.connected {
            background: rgba(0, 255, 0, 0.15);
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 18px;
            }

            .instrument {
                padding: 15px;
            }
        }

        .scan-line {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(0, 255, 0, 0.3), transparent);
            pointer-events: none;
            animation: scan 8s linear infinite;
            z-index: 999;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100vh; }
        }

        .display-section {
            grid-column: 1 / -1;
            border: 2px solid #0f0;
            padding: 20px;
            background: rgba(0, 255, 0, 0.02);
        }

        .display-section h2 {
            font-size: 16px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #0f0;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .display-section h2 .meta {
            font-size: 10px;
            opacity: 0.6;
            letter-spacing: 1px;
        }

        .display-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #000;
            border: 1px solid #0f0;
            overflow: hidden;
            box-shadow: 0 0 24px rgba(0, 255, 0, 0.15) inset;
        }

        .display-wrap::after {
            content: "";
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0) 0px,
                rgba(0, 0, 0, 0) 2px,
                rgba(0, 0, 0, 0.18) 3px
            );
            pointer-events: none;
        }

        .camera-feed,
        .lissajous {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .camera-feed {
            object-fit: cover;
            filter: grayscale(0.6) contrast(1.05) brightness(0.85) hue-rotate(60deg);
            transition: opacity 0.15s linear;
        }

        .camera-feed.error {
            opacity: 0 !important;
        }

        .lissajous {
            mix-blend-mode: screen;
            transition: opacity 0.15s linear;
        }

        .display-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 14px;
            margin-top: 16px;
        }

        .display-controls .control-group {
            margin-bottom: 0;
        }

        .display-controls .toggle-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .toggle-btn {
            flex: 1 1 auto;
            padding: 8px 10px;
            border: 1px solid #0f0;
            background: #0a0a0a;
            color: #0f0;
            font-family: inherit;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.1s;
        }

        .toggle-btn:hover {
            background: rgba(0, 255, 0, 0.08);
        }

        .toggle-btn.active {
            background: #0f0;
            color: #0a0a0a;
            box-shadow: 0 0 12px rgba(0, 255, 0, 0.6);
        }

        .cam-badge {
            font-size: 9px;
            padding: 3px 6px;
            border: 1px solid #0f0;
            border-radius: 3px;
            opacity: 0.7;
        }
        .cam-badge.live { background: rgba(0,255,0,0.15); opacity: 1; }
        .cam-badge.off { color: #f55; border-color: #f55; }
    </style>
</head>
<body>
    <div class="scan-line"></div>

    <div class="header">
        <h1>⚡ xfmix</h1>
        <p>COMPUTER MUSIC HISTORY · SYNTHESIZER + DRUM MACHINE</p>
    </div>

    <div class="container">
        <!-- VISUAL DISPLAY -->
        <div class="display-section">
            <h2>
                <span>Visual Display · Lissajous ⊗ Camera</span>
                <span class="meta">
                    <span class="cam-badge" id="cam-badge">CAM…</span>
                </span>
            </h2>
            <div class="display-wrap">
                <img class="camera-feed" id="camera-feed" alt="" src="/camera.mjpg">
                <canvas class="lissajous" id="lissajous-canvas"></canvas>
            </div>

            <div class="display-controls">
                <div class="control-group slider-group">
                    <label class="control-label">Camera ↔ Lissajous</label>
                    <input type="range" id="vis-mix" min="0" max="1" value="0.55" step="0.01">
                </div>
                <div class="control-group slider-group">
                    <label class="control-label">Y:X Ratio</label>
                    <input type="range" id="vis-ratio" min="0.25" max="4" value="1.5" step="0.01">
                </div>
                <div class="control-group slider-group">
                    <label class="control-label">Phase</label>
                    <input type="range" id="vis-phase" min="0" max="360" value="90" step="1">
                </div>
                <div class="control-group slider-group">
                    <label class="control-label">Trail</label>
                    <input type="range" id="vis-trail" min="0" max="0.98" value="0.88" step="0.01">
                </div>
                <div class="control-group">
                    <label class="control-label">Source</label>
                    <div class="toggle-row">
                        <button class="toggle-btn active" id="vis-source-engine" data-source="engine">Engine</button>
                        <button class="toggle-btn" id="vis-source-free" data-source="free">Free</button>
                    </div>
                </div>
                <div class="control-group">
                    <label class="control-label">Audio</label>
                    <div class="toggle-row">
                        <button class="toggle-btn" id="vis-audible">Audible</button>
                        <button class="toggle-btn" id="vis-camera-toggle">Camera</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- DRUM MACHINE -->
        <div class="instrument">
            <h2>Water Drop Drum</h2>

            <div class="control-group">
                <label class="control-label">Hit Pads</label>
                <div class="drum-pads">
                    <button class="pad" data-lane="0">Kick</button>
                    <button class="pad" data-lane="1">Snare</button>
                    <button class="pad" data-lane="2">Hat</button>
                    <button class="pad" data-lane="3">Tom</button>
                    <button class="pad" data-lane="4">Rim</button>
                    <button class="pad" data-lane="5">Crash</button>
                </div>
            </div>

            <div class="control-group slider-group">
                <label class="control-label">Pitch</label>
                <input type="range" id="drum-pitch" min="200" max="2000" value="800" step="10">
            </div>

            <div class="control-group slider-group">
                <label class="control-label">Decay (ms)</label>
                <input type="range" id="drum-decay" min="100" max="2000" value="300" step="50">
            </div>

            <div class="control-group slider-group">
                <label class="control-label">Resonance</label>
                <input type="range" id="drum-resonance" min="5" max="50" value="20" step="1">
            </div>

            <div class="control-group slider-group">
                <label class="control-label">Mix Level</label>
                <input type="range" id="drum-level" min="0" max="1" value="0.7" step="0.01">
            </div>
        </div>

        <!-- SYNTH -->
        <div class="instrument">
            <h2>Engine Synthesizer</h2>

            <div class="control-group">
                <label class="control-label">Keyboard (C-B)</label>
                <div class="keyboard" id="keyboard">
                    <!-- Generated by JavaScript -->
                </div>
            </div>

            <div class="control-group slider-group">
                <label class="control-label">RPM</label>
                <input type="range" id="engine-rpm" min="10" max="200" value="60" step="1">
            </div>

            <div class="control-group slider-group">
                <label class="control-label">Load (Throttle)</label>
                <input type="range" id="engine-load" min="0" max="1" value="0.5" step="0.05">
            </div>

            <div class="control-group">
                <label class="control-label">Cylinders</label>
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;">
                    <button class="pad" data-cylinders="4" style="width: 100%;">4</button>
                    <button class="pad" data-cylinders="6" style="width: 100%;">6</button>
                    <button class="pad" data-cylinders="8" style="width: 100%;">8</button>
                </div>
            </div>

            <div class="control-group slider-group">
                <label class="control-label">Resonance</label>
                <input type="range" id="engine-resonance" min="10" max="50" value="30" step="1">
            </div>

            <div class="control-group slider-group">
                <label class="control-label">Mix Level</label>
                <input type="range" id="engine-level" min="0" max="1" value="0.7" step="0.01">
            </div>
        </div>

        <!-- QUBIT CONTROL -->
        <div class="qubit-section">
            <h3>Quantum Stochasticity (Qubit)</h3>
            <p style="font-size: 11px; margin-bottom: 15px; opacity: 0.7;">Xenakis-inspired probability field for stochastic variations</p>
            <div class="bloch-sphere" id="qubit-sphere">
                <div class="bloch-dot" id="qubit-dot"></div>
            </div>
            <input type="range" id="qubit-slider" min="0" max="1" value="0.5" step="0.01" style="margin-top: 15px; max-width: 200px; margin-left: auto; margin-right: auto; display: block;">
            <p style="font-size: 10px; margin-top: 10px; opacity: 0.6;">Superposition: 0% ← → 100%</p>
        </div>

        <!-- FOOTER -->
        <div class="footer">
            <div class="status" id="status">
                <span id="status-text">●</span> Connecting...
            </div>
        </div>
    </div>

    <script>
        // CONSTANTS
        const WS_URL = `ws://${window.location.host}/ws`;
        const NOTES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const BASE_NOTE = 36; // C2

        // STATE
        let ws = null;
        let isConnected = false;
        let currentNote = null;

        // INIT
        function init() {
            connectWebSocket();
            setupDrumPads();
            setupKeyboard();
            setupQubit();
            setupSliders();
            setupCylinders();
            Visuals.init();
        }

        // WebSocket connection
        function connectWebSocket() {
            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                isConnected = true;
                updateStatus(true);
                console.log("✓ Connected to xfmix");
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    console.debug("Server:", data);
                } catch (e) {
                    console.error("Message parse error:", e);
                }
            };

            ws.onerror = (error) => {
                console.error("WebSocket error:", error);
                updateStatus(false);
            };

            ws.onclose = () => {
                isConnected = false;
                updateStatus(false);
                console.log("✗ Disconnected");
                setTimeout(connectWebSocket, 2000); // Reconnect
            };
        }

        function sendMessage(data) {
            if (isConnected && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(data));
            }
        }

        function updateStatus(connected) {
            const statusEl = document.getElementById('status');
            const textEl = document.getElementById('status-text');
            if (connected) {
                statusEl.classList.add('connected');
                textEl.textContent = '◉';
            } else {
                statusEl.classList.remove('connected');
                textEl.textContent = '◯';
            }
        }

        // DRUM PADS
        function setupDrumPads() {
            document.querySelectorAll('.instrument:first-child .pad').forEach(pad => {
                pad.addEventListener('click', (e) => {
                    const lane = parseInt(e.target.dataset.lane);
                    sendMessage({
                        type: 'water',
                        lane: lane,
                        velocity: 0.8
                    });
                    Visuals.trigger('drum', { lane: lane, velocity: 0.8 });
                    pad.style.animation = 'none';
                    setTimeout(() => pad.style.animation = '', 10);
                });
            });
        }

        // KEYBOARD
        function setupKeyboard() {
            const keyboard = document.getElementById('keyboard');
            for (let i = 0; i < 12; i++) {
                const key = document.createElement('button');
                key.classList.add('key');
                key.textContent = NOTES[i];
                key.dataset.note = BASE_NOTE + i;
                key.addEventListener('mousedown', () => playNote(parseInt(key.dataset.note), 1.0));
                key.addEventListener('mouseup', () => releaseNote());
                key.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    playNote(parseInt(key.dataset.note), 1.0);
                });
                key.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    releaseNote();
                });
                keyboard.appendChild(key);
            }
        }

        function playNote(note, velocity) {
            currentNote = note;
            const rpm = parseInt(document.getElementById('engine-rpm').value);
            const load = parseFloat(document.getElementById('engine-load').value);
            const cylinders = parseInt(document.querySelector('[data-cylinders]').dataset.cylinders || 4);
            sendMessage({
                type: 'engine',
                note: note,
                velocity: velocity,
                rpm: rpm,
                load: load,
                cylinders: cylinders
            });
            Visuals.trigger('engine', { note: note, velocity: velocity });
        }

        function releaseNote() {
            currentNote = null;
        }

        // QUBIT (Bloch sphere)
        function setupQubit() {
            const sphere = document.getElementById('qubit-sphere');
            const dot = document.getElementById('qubit-dot');
            const slider = document.getElementById('qubit-slider');

            function updateQubit(value) {
                const angle = value * Math.PI * 2;
                const x = Math.cos(angle) * 60;
                const y = Math.sin(angle) * 60;
                dot.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
                sendMessage({ type: 'qubit', value: value });
            }

            sphere.addEventListener('click', (e) => {
                const rect = sphere.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const x = e.clientX - cx;
                const y = e.clientY - cy;
                const angle = Math.atan2(y, x) / (Math.PI * 2);
                const value = angle < 0 ? angle + 1 : angle;
                slider.value = value;
                updateQubit(value);
            });

            slider.addEventListener('input', (e) => {
                updateQubit(parseFloat(e.target.value));
            });

            updateQubit(0.5); // Init
        }

        // SLIDERS
        function setupSliders() {
            const sliders = document.querySelectorAll('input[type="range"]');
            sliders.forEach(slider => {
                slider.addEventListener('input', (e) => {
                    const id = e.target.id;
                    const value = parseFloat(e.target.value);

                    if (id === 'drum-level') {
                        sendMessage({ type: 'mix', drum: value, synth: parseFloat(document.getElementById('engine-level').value) });
                    } else if (id === 'engine-level') {
                        sendMessage({ type: 'mix', drum: parseFloat(document.getElementById('drum-level').value), synth: value });
                    }
                });
            });
        }

        // CYLINDERS
        function setupCylinders() {
            document.querySelectorAll('[data-cylinders]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    // Visual feedback
                    document.querySelectorAll('[data-cylinders]').forEach(b => b.style.opacity = '0.5');
                    e.target.style.opacity = '1';
                });
            });
        }

        // VISUALS — Lissajous oscilloscope overlaid on Pi camera feed.
        // History reference: Mary Ellen Bute's oscilloscope films (1950s) and
        // Ben Laposky's "Oscillons" — composing with X/Y sine pairs.
        const Visuals = {
            canvas: null,
            ctx: null,
            feed: null,
            badge: null,
            state: {
                mix: 0.55,
                ratio: 1.5,
                phase: Math.PI / 2,
                trail: 0.88,
                source: 'engine',
                audible: false,
                cameraOn: true,
            },
            audio: { ctx: null, oscX: null, oscY: null, gain: null },
            triggers: [],
            baseFreq: 110,
            time: 0,

            init() {
                this.canvas = document.getElementById('lissajous-canvas');
                this.feed = document.getElementById('camera-feed');
                this.badge = document.getElementById('cam-badge');
                this.ctx = this.canvas.getContext('2d');

                this.fitCanvas();
                window.addEventListener('resize', () => this.fitCanvas());

                // MJPEG never fires `load` reliably, so flip to LIVE optimistically.
                let live = false;
                const markLive = () => {
                    if (live || !this.state.cameraOn) return;
                    live = true;
                    this.badge.textContent = 'LIVE';
                    this.badge.className = 'cam-badge live';
                };
                this.feed.addEventListener('load', markLive);
                setTimeout(markLive, 1500);
                this.feed.addEventListener('error', () => {
                    this.feed.classList.add('error');
                    this.badge.textContent = 'NO CAM';
                    this.badge.className = 'cam-badge off';
                });

                const wire = (id, fn) => {
                    const el = document.getElementById(id);
                    el.addEventListener('input', e => fn(parseFloat(e.target.value)));
                    fn(parseFloat(el.value));
                };
                wire('vis-mix', v => { this.state.mix = v; this.applyMix(); });
                wire('vis-ratio', v => { this.state.ratio = v; });
                wire('vis-phase', v => { this.state.phase = v * Math.PI / 180; });
                wire('vis-trail', v => { this.state.trail = v; });

                document.getElementById('vis-source-engine')
                    .addEventListener('click', () => this.setSource('engine'));
                document.getElementById('vis-source-free')
                    .addEventListener('click', () => this.setSource('free'));

                const audibleBtn = document.getElementById('vis-audible');
                audibleBtn.addEventListener('click', () => {
                    this.state.audible = !this.state.audible;
                    audibleBtn.classList.toggle('active', this.state.audible);
                    if (this.state.audible) this.startAudio();
                    else this.stopAudio();
                });

                const camBtn = document.getElementById('vis-camera-toggle');
                camBtn.classList.add('active');
                camBtn.addEventListener('click', () => {
                    this.state.cameraOn = !this.state.cameraOn;
                    camBtn.classList.toggle('active', this.state.cameraOn);
                    if (this.state.cameraOn) {
                        this.feed.classList.remove('error');
                        this.feed.src = '/camera.mjpg?t=' + Date.now();
                        this.badge.textContent = 'CAM…';
                        this.badge.className = 'cam-badge';
                        live = false;
                        setTimeout(markLive, 1500);
                    } else {
                        this.feed.src = '';
                        this.feed.classList.add('error');
                        this.badge.textContent = 'OFF';
                        this.badge.className = 'cam-badge off';
                    }
                });

                this.start();
            },

            fitCanvas() {
                const rect = this.canvas.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                this.canvas.width = Math.max(1, Math.round(rect.width * dpr));
                this.canvas.height = Math.max(1, Math.round(rect.height * dpr));
                this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                this.ctx.fillStyle = '#000';
                this.ctx.fillRect(0, 0, rect.width, rect.height);
            },

            applyMix() {
                // 0 = camera only, 1 = lissajous only.
                this.feed.style.opacity = (1 - this.state.mix).toFixed(2);
                this.canvas.style.opacity = this.state.mix.toFixed(2);
            },

            setSource(name) {
                this.state.source = name;
                document.getElementById('vis-source-engine')
                    .classList.toggle('active', name === 'engine');
                document.getElementById('vis-source-free')
                    .classList.toggle('active', name === 'free');
            },

            trigger(kind, data) {
                const intensity = data.velocity != null ? data.velocity : 0.8;
                this.triggers.push({
                    t: 0,
                    kind,
                    intensity,
                    lane: data.lane != null ? data.lane : 0,
                    note: data.note != null ? data.note : 60,
                });
                if (this.triggers.length > 12) this.triggers.shift();
            },

            start() {
                const loop = () => {
                    this.tick();
                    requestAnimationFrame(loop);
                };
                requestAnimationFrame(loop);
            },

            tick() {
                const w = this.canvas.clientWidth;
                const h = this.canvas.clientHeight;
                if (!w || !h) return;

                // Decay the trail by drawing translucent black over the frame.
                this.ctx.globalCompositeOperation = 'source-over';
                this.ctx.fillStyle =
                    `rgba(0,0,0,${(1 - this.state.trail).toFixed(3)})`;
                this.ctx.fillRect(0, 0, w, h);

                this.triggers = this.triggers.filter(t => t.t < 1);
                this.triggers.forEach(t => { t.t += 0.025; });

                const dt = 1 / 60;
                this.time += dt;

                let fx = this.baseFreq;
                if (this.state.source === 'engine' && currentNote != null) {
                    // Drop two octaves so the figure stays legible.
                    fx = 440 * Math.pow(2, (currentNote - 69) / 12) / 4;
                }
                let fy = fx * this.state.ratio;

                let amp = 0.45;
                let extraPhase = 0;
                for (const t of this.triggers) {
                    amp += (1 - t.t) * 0.12 * t.intensity;
                    extraPhase += (1 - t.t) * t.intensity * 0.6;
                    if (t.kind === 'drum') fy += (t.lane - 2.5) * 3;
                }
                if (amp > 0.92) amp = 0.92;

                const cx = w / 2;
                const cy = h / 2;
                const rx = w * 0.45 * amp;
                const ry = h * 0.45 * amp;
                const phase = this.state.phase + extraPhase;
                const steps = 240;
                const tStep = dt / steps;
                const tStart = this.time;

                this.ctx.lineWidth = 1.3;
                this.ctx.strokeStyle = 'rgba(0,255,140,0.85)';
                this.ctx.shadowBlur = 8;
                this.ctx.shadowColor = 'rgba(0,255,120,0.5)';
                this.ctx.beginPath();
                for (let i = 0; i <= steps; i++) {
                    const tt = tStart + i * tStep;
                    const x = cx + Math.sin(2 * Math.PI * fx * tt + phase) * rx;
                    const y = cy + Math.sin(2 * Math.PI * fy * tt) * ry;
                    if (i === 0) this.ctx.moveTo(x, y);
                    else this.ctx.lineTo(x, y);
                }
                this.ctx.stroke();
                this.ctx.shadowBlur = 0;

                if (this.state.audible && this.audio.ctx) {
                    const now = this.audio.ctx.currentTime;
                    this.audio.oscX.frequency.setTargetAtTime(fx, now, 0.02);
                    this.audio.oscY.frequency.setTargetAtTime(fy, now, 0.02);
                }
            },

            startAudio() {
                if (this.audio.ctx) return;
                const Ctx = window.AudioContext || window.webkitAudioContext;
                if (!Ctx) return;
                const ctx = new Ctx();
                const gain = ctx.createGain();
                gain.gain.value = 0.06;
                gain.connect(ctx.destination);
                const oscX = ctx.createOscillator();
                const oscY = ctx.createOscillator();
                oscX.type = 'sine';
                oscY.type = 'sine';
                oscX.frequency.value = this.baseFreq;
                oscY.frequency.value = this.baseFreq * this.state.ratio;
                oscX.connect(gain);
                oscY.connect(gain);
                oscX.start();
                oscY.start();
                this.audio = { ctx, gain, oscX, oscY };
            },

            stopAudio() {
                if (!this.audio.ctx) return;
                try { this.audio.oscX.stop(); this.audio.oscY.stop(); }
                catch (_) {}
                this.audio.ctx.close();
                this.audio = { ctx: null, oscX: null, oscY: null, gain: null };
            },
        };

        // START
        window.addEventListener('load', init);
    </script>
</body>
</html>
